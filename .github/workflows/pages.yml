name: Pages

on:
  push:
    paths:
      - "customer-table/**"
      - "pos-dashboard/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "customer-table/**"
      - "pos-dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            customer-table/package-lock.json
            pos-dashboard/package-lock.json
      - name: Build customer table
        working-directory: customer-table
        run: npm ci && npm run build
      - name: Build POS dashboard
        working-directory: pos-dashboard
        run: npm ci && npm run build
      # One Pages site: the customer table at the root, the POS dashboard under /pos/.
      - name: Assemble site
        run: |
          mkdir -p _site/pos
          cp -r customer-table/dist/. _site/
          cp -r pos-dashboard/dist/. _site/pos/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Publishes to GitHub Pages only from the default branch; other branches and PRs just build.
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
